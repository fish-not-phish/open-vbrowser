services:
  ovb_postgres:
    image: postgres:16-alpine
    container_name: ovb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ovb}
      POSTGRES_USER: ${DB_USER:-ovb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - ovb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ovb} -d ${DB_NAME:-ovb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ovb_redis:
    image: redis:7-alpine
    container_name: ovb_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ovb_backend:
    build: ../backend
    container_name: ovb_backend
    command: ["--migrate", "daphne", "-b", "0.0.0.0", "-p", "8000", "backend.asgi:application"]
    restart: unless-stopped
    depends_on:
      ovb_postgres:
        condition: service_healthy
      ovb_redis:
        condition: service_healthy
    env_file: .env

  ovb_worker:
    build: ../backend
    container_name: ovb_worker
    command: ["celery", "-A", "backend", "worker", "--loglevel=info", "--concurrency=4", "--uid=nobody", "--gid=nogroup"]
    restart: unless-stopped
    depends_on:
      ovb_postgres:
        condition: service_healthy
      ovb_redis:
        condition: service_healthy
      ovb_backend:
        condition: service_started
    env_file: .env

  ovb_beat:
    build: ../backend
    container_name: ovb_beat
    command: ["celery", "-A", "backend", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler", "--uid=nobody", "--gid=nogroup"]
    restart: unless-stopped
    depends_on:
      ovb_postgres:
        condition: service_healthy
      ovb_redis:
        condition: service_healthy
      ovb_backend:
        condition: service_started
    env_file: .env

  ovb_frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://127.0.0.1:8000/api/}
        NEXT_PUBLIC_BASE_URL_ACCOUNTS: ${NEXT_PUBLIC_BASE_URL_ACCOUNTS:-http://127.0.0.1:8000/}
    container_name: ovb_frontend
    restart: unless-stopped
    depends_on:
      - ovb_backend
    env_file: .env

  ovb_caddy:
    image: caddy:alpine
    container_name: ovb_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ovb_caddy_data:/data
      - ovb_caddy_config:/config
    depends_on:
      - ovb_backend
      - ovb_frontend

volumes:
  ovb_postgres_data:
  ovb_caddy_data:
  ovb_caddy_config:
