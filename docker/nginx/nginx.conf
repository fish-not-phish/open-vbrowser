events {
    worker_connections 1024;
}

http {
    # ── Upstream services ──────────────────────────────────────────────────────
    upstream ovb_backend {
        server ovb_backend:8000;
    }

    upstream ovb_frontend {
        server ovb_frontend:3000;
    }

    # ── HTTP → HTTPS redirect + ACME challenge ─────────────────────────────────
    # On first run this is the only active server block — Certbot uses the
    # /.well-known/acme-challenge/ location to complete the HTTP-01 challenge.
    # After the certificate is obtained, uncomment the HTTPS server block below
    # and reload Nginx: docker compose exec ovb_nginx nginx -s reload
    server {
        listen 80;
        server_name OVB_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

